[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-development-harness"
version = "0.1.0"
description = "Stateful autonomous AI development harness for Apple Silicon macOS"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "PyYAML>=6.0", "typer>=0.12", "httpx>=0.27", "httpcore>=1.0,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx2>=2"]
tokenization = ["tiktoken>=0.8", "tokenizers>=0.20"]

[project.scripts]
harness = "harness.cli:app"
harness-filesystem-mcp = "harness.mcp_servers.filesystem:main"
harness-obsidian-mcp = "harness.mcp_servers.obsidian:main"
harness-apple-shell-mcp = "harness.mcp_servers.apple_shell.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/harness/mcp_servers"]
addopts = "--cov=harness --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=100"
