harness:
  name: autonomous-development-harness
  environment: development
paths:
  workspace: ./workspace
  obsidian_vault: ./vault
  logs: ./logs
  database: ./data/harness.db
database: {type: sqlite}
agents:
  contract_mode: required
git: {enabled: false, main: main, dev: dev, remote: null}
memory:
  context: {max_bytes: 65536}
  obsidian: {enabled: true}
  qdrant: {enabled: true, url: http://127.0.0.1:6333, collection: harness-memory, timeout: {total: 5, connect: 2, read: 5}}
  embeddings: {provider: lmstudio, base_url: http://127.0.0.1:1234/v1, model: text-embedding-qwen3-embedding-0.6b, dimensions: 1024, batch_size: 32, timeout: {total: 30, connect: 5, read: 30}}
  monitoring: {enabled: true, interval_seconds: 60, evidence_max_age_hours: 168}
models:
  defaults: {provider: lmstudio}
  providers:
    openai: {enabled: true, base_url: https://api.openai.com/v1, timeout: {total: 120, connect: 5, read: 30}, retry: {max_attempts: 3, base_delay: 0.25, max_delay: 4}}
    openrouter: {enabled: true, base_url: https://openrouter.ai/api/v1, timeout: {total: 120, connect: 5, read: 30}, retry: {max_attempts: 3, base_delay: 0.25, max_delay: 4}}
    lmstudio: {enabled: true, kind: lmstudio, base_url: http://127.0.0.1:1234/v1, timeout: {total: 120, connect: 5, read: 30}, retry: {max_attempts: 3, base_delay: 0.25, max_delay: 4}}
profiles:
  planner:
    model: {primary: lmstudio, fallback: [openai]}
    instructions: Produce grounded, executable dependency plans; never invent completion evidence.
    tools: [mcp.vault.read_note, mcp.vault.list_notes, mcp.vault.search_notes, mcp.vault.knowledge_note, mcp.vault.backlinks, mcp.vault.knowledge_search]
    permissions: [obsidian]
  coding:
    model: {primary: lmstudio, fallback: [openai]}
    instructions: Implement the assigned step using workspace tools and report actual observations.
    tools: [filesystem.read, filesystem.search, filesystem.write, filesystem.create, search.text, search.symbols, search.files, test.run_tests, test.run_file, test.run_coverage, quality.lint, quality.format, quality.typecheck, shell.execute, mcp.vault.read_note, mcp.vault.list_notes, mcp.vault.search_notes, mcp.vault.knowledge_note, mcp.vault.backlinks, mcp.vault.knowledge_search]
    permissions: [filesystem, shell, obsidian]
    max_steps: 20
  validator:
    model: {primary: lmstudio, fallback: [openai]}
    instructions: Independently inspect observed artifacts, tests and requirements; fail closed on missing evidence.
    tools: [mcp.vault.read_note, mcp.vault.list_notes, mcp.vault.search_notes, mcp.vault.knowledge_note, mcp.vault.backlinks, mcp.vault.knowledge_search]
    permissions: [obsidian]
api: {host: 127.0.0.1, port: 8080, swagger: true}
logging: {level: INFO, file: ./logs/harness.log}
tools:
  permissions: {filesystem: write, shell: write, git: read, docker: denied, filesystem.delete: denied, obsidian: read}
  # MCP servers are opt-in. Enable this local reference server explicitly.
  mcp:
    servers:
      files:
        enabled: false
        builtin: filesystem
        read_only: true
        allow_delete: false
      vault:
        enabled: true
        builtin: obsidian
        read_only: true
  http:
    allowed_hosts: []
    timeout: {total: 30, connect: 5, read: 30}
  docker:
    compose_file: ./docker-compose.yml
    socket_path: null
  git:
    allowed_hosts: []
    ca_bundle: null
    credentials: {}
    ssh:
      allowed_hosts: []
      allowed_ports: [22]
      host_keys: {}
      credentials: {}
